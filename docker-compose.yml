version: "3.9"

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # ports:
    #   - "27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URL=mongodb://mongo:27017/ecommerce
      - CORS_ORIGIN=http://localhost:3000
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    ports:
      - "5000:5000"
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=http://localhost:5000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"


volumes:
  mongo_data:
